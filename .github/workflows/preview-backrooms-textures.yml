name: Generate Backrooms texture previews

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/preview_backrooms_textures.py"
      - "tools/generate_minecraft_skin_header.py"
      - "tools/make_skin_background_transparent.py"
      - "tyrarooms/src/Skin maior.png"
      - ".github/workflows/preview-backrooms-textures.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Generate texture and skin previews
        run: |
          python3 tools/preview_backrooms_textures.py
          python3 tools/generate_minecraft_skin_header.py
          python3 tools/make_skin_background_transparent.py

      - name: Upload generated BMP files
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-textures-bmp
          path: texture-previews/*
          if-no-files-found: error
          retention-days: 30
