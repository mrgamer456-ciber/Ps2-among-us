name: Compilar Jogo PS2
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o seu código do Among Us na máquina principal (que tem internet e todas as ferramentas)
      - uses: actions/checkout@v4

      # 2. Baixa a Tyra Engine usando a ferramenta oficial do GitHub (sem usar curl ou wget)
      - name: Baixar Tyra Engine de forma nativa
        uses: actions/checkout@v4
        with:
          repository: h4570/tyra
          path: tyra-repo

      # 3. Move apenas a pasta essencial da engine para o seu projeto
      - name: Organizar as pastas
        run: |
          mv tyra-repo/engine ./tyra
          rm -rf tyra-repo

            # 4. Executa o compilador injetando as definicoes do PS2 e as bibliotecas de imagem e graficos
      - name: Executar Compilacao Nativa PS2
        uses: docker://h4570/tyra:latest
        with:
          args: /bin/bash -c "/usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-g++ -O2 -D_EE_ main.cpp game.cpp -o amongus.elf -I./tyra/inc -I/usr/local/ps2dev/ps2sdk/ee/include -I/usr/local/ps2dev/ps2sdk/common/include -I/usr/local/ps2dev/ee/mips64r5900el-ps2-elf/include -L/usr/local/ps2dev/ps2sdk/ee/lib -L/usr/local/ps2dev/ee/mips64r5900el-ps2-elf/lib -ltyra -lpatches -lgskit -ldma -lgraph -ldraw -lpacket -lpng -lz"

      # 5. Disponibiliza o ELF para download
      - name: Baixar o arquivo ELF pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf
          path: amongus.elf
