name: Compilar Jogo PS2
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compilar com a Tyra Engine
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src h4570/tyra:latest /bin/bash -c "ee-g++ -O2 main.cpp game.cpp -o amongus.elf -ltyra -lpatches -lgskit -ldma -lgraph -ldraw -lpacket"
          
      - name: Baixar o arquivo ELF pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf
          path: amongus.elf
