name: Compilar Among Us PS2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra

    steps:
      - name: Instalar dependências do runner
        run: |
          apt-get update
          apt-get install -y git make wget

      - name: Configurar diretório seguro do Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar engine Tyra e jogo
        run: |
          echo "Compilando engine Tyra e Among Us para PS2..."
          make clean all
          test -s bin/amongus.elf
          ls -lh bin/amongus.elf

      - name: Enviar pacote para teste no PS2
        uses: actions/upload-artifact@v4
        with:
          name: amongus-ps2
          path: bin/
          if-no-files-found: error
