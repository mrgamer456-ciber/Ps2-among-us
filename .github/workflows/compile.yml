name: Compilar Jogo PS2
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra:latest
    steps:
      - uses: actions/checkout@v4

      - name: Executar Compilacao Nativa PS2
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=/usr/local/ps2dev/ps2sdk
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PATH
          
          ee-g++ -O2 main.cpp game.cpp -o amongus.elf -I$PS2SDK/ee/include -I$PS2SDK/common/include -L$PS2SDK/ee/lib -ltyra -lpatches -lgskit -ldma -lgraph -ldraw -lpacket

      - name: Baixar o arquivo ELF pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf
          path: amongus.elf
