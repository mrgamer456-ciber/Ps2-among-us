name: Compilar Jogo PS2
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra:latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Dependencias da Tyra
        run: |
          mkdir -p ./tyra
          curl -L "https://github.com" | tar -xzf - --strip-components=2 "tyra-master/engine"
          mv ./engine/* ./tyra/ 2>/dev/null || mv ./tyra-master/engine/* ./tyra/ 2>/dev/null || true

      - name: Executar Compilacao Nativa PS2
        run: |
          /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-g++ -O2 main.cpp game.cpp -o amongus.elf -I./tyra/inc -I/usr/local/ps2dev/ps2sdk/ee/include -I/usr/local/ps2dev/ps2sdk/common/include -L/usr/local/ps2dev/ps2sdk/ee/lib -ltyra -lpatches -lgskit -ldma -lgraph -ldraw -lpacket

      - name: Baixar o arquivo ELF pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf
          path: amongus.elf
