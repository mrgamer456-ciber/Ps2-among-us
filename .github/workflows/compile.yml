name: Compilar Jogo PS2
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o Tyra CLI
        run: |
          npm install -g @h4570/tyra-cli

      - name: Compilar Código C++
        run: |
          tyra-cli build .

      - name: Baixar o arquivo ELF pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf
          path: build/amongus.elf
