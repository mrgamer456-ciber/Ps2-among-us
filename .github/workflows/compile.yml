name: Compilar Jogo PS2
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Tyra Engine de forma nativa
        uses: actions/checkout@v4
        with:
          repository: h4570/tyra
          path: tyra-repo

      - name: Organizar as pastas
        run: |
          mv tyra-repo/engine ./tyra
          rm -rf tyra-repo

      - name: Executar Compilacao Nativa PS2
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src h4570/tyra:latest /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-g++ -O2 -D_EE_ main.cpp game.cpp -o amongus.elf -I./tyra/inc -I/usr/local/ps2dev/ps2sdk/ee/include -I/usr/local/ps2dev/ps2sdk/common/include -I/usr/local/ps2dev/ee/mips64r5900el-ps2-elf/include -L/usr/local/ps2dev/ps2sdk/ee/lib -L/usr/local/ps2dev/ee/mips64r5900el-ps2-elf/lib -ltyra -lpatches -lgskit -ldma -lgraph -ldraw -lpacket -lpng -lz

      - name: Baixar o arquivo ELF pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf
          path: amongus.elf
