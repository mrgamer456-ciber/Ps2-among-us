name: Build Backrooms PS2 Maze

on:
  workflow_dispatch:
  push:
    paths:
      - "tyrarooms/**"
      - "tools/generate_menu_background.py"
      - "tools/generate_minecraft_skin_header.py"
      - ".github/workflows/build-backrooms.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: America/Fortaleza

    steps:
      - name: Configure timezone without questions
        run: |
          ln -snf /usr/share/zoneinfo/America/Fortaleza /etc/localtime
          echo "America/Fortaleza" > /etc/timezone
          dpkg-reconfigure -f noninteractive tzdata || true

      - name: Install build tools without interactive prompts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" git cmake make pkg-config python3-pil

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout including gsKit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check PS2SDK toolchain
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "PS2SDK pad library candidates:"
          find "$PS2SDK/ee/lib" "$PS2DEV/ee/lib" -maxdepth 1 -name "libpad*" -print 2>/dev/null || true
          command -v mips64r5900el-ps2-elf-gcc
          command -v mips64r5900el-ps2-elf-g++
          test -d "$PS2DEV"
          test -d "$PS2SDK"

      - name: Generate the Minecraft skin texture header
        run: python3 tools/generate_minecraft_skin_header.py

      - name: Generate the menu background texture header
        run: python3 tools/generate_menu_background.py

      - name: Configure and compile Backrooms maze
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tyrarooms/build
          {
            export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
            cmake -S tyrarooms -B tyrarooms/build \
              -DCMAKE_C_COMPILER=mips64r5900el-ps2-elf-gcc \
              -DCMAKE_CXX_COMPILER=mips64r5900el-ps2-elf-g++ \
              -DCMAKE_ASM_COMPILER=mips64r5900el-ps2-elf-gcc
            cmake --build tyrarooms/build --parallel 2
            test -s tyrarooms/build/backrooms.elf
            test -s tyrarooms/build/backrooms-nomenu.elf
            test -s tyrarooms/build/backrooms-solid-test.elf
            test -s tyrarooms/build/backrooms-solid-reversed-z-test.elf
            test -s tyrarooms/build/gs_diagnostic.elf
            test -s tyrarooms/build/backrooms-isolamento-01.elf
            test -s tyrarooms/build/backrooms-z24-repair-v1.elf
            test -s tyrarooms/build/backrooms-rebuild-01-clear-only.elf
            test -s tyrarooms/build/backrooms-rebuild-02-one-rectangle.elf
            ls -lh tyrarooms/build/backrooms-z24-repair-v1.elf tyrarooms/build/backrooms.elf tyrarooms/build/backrooms-nomenu.elf tyrarooms/build/backrooms-solid-test.elf tyrarooms/build/backrooms-solid-reversed-z-test.elf tyrarooms/build/gs_diagnostic.elf tyrarooms/build/gs_diagnostic_gameinit.elf tyrarooms/build/backrooms-isolamento-01.elf
          } 2>&1 | tee tyrarooms/build/build.log

      - name: Upload build error log (only if build fails)
        if: failure() && hashFiles('tyrarooms/build/build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-build-error-log
          path: tyrarooms/build/build.log
          if-no-files-found: warn

      - name: Upload clean rebuild stage 01 - clear only ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-rebuild-01-clear-only
          path: tyrarooms/build/backrooms-rebuild-01-clear-only.elf
          if-no-files-found: error

      - name: Upload clean rebuild stage 02 - one rectangle ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-rebuild-02-one-rectangle
          path: tyrarooms/build/backrooms-rebuild-02-one-rectangle.elf
          if-no-files-found: error

      - name: Upload 24-bit reversed-Z repair ELF v1
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-z24-repair-v1
          path: tyrarooms/build/backrooms-z24-repair-v1.elf
          if-no-files-found: error

      - name: Upload maze ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-ps2-maze
          path: tyrarooms/build/backrooms.elf
          if-no-files-found: error

      - name: Upload direct-to-game ELF (no menu)
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-ps2-no-menu
          path: tyrarooms/build/backrooms-nomenu.elf
          if-no-files-found: error

      - name: Upload solid-color maze diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-ps2-solid-test
          path: tyrarooms/build/backrooms-solid-test.elf
          if-no-files-found: error

      - name: Upload reversed-Z solid diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-ps2-solid-reversed-z-test
          path: tyrarooms/build/backrooms-solid-reversed-z-test.elf
          if-no-files-found: error

      - name: Upload graphics diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-gs-diagnostic
          path: tyrarooms/build/gs_diagnostic.elf
          if-no-files-found: error

      - name: Upload game-init graphics diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-gs-gameinit-diagnostic
          path: tyrarooms/build/gs_diagnostic_gameinit.elf
          if-no-files-found: error

      - name: Upload isolated 2D-only diagnostic ELF 01
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-isolamento-01
          path: tyrarooms/build/backrooms-isolamento-01.elf
          if-no-files-found: error
