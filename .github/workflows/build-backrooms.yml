name: Build Backrooms PS2 Maze

on:
  workflow_dispatch:
  push:
    paths:
      - "tyrarooms/**"
      - ".github/workflows/build-backrooms.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: America/Fortaleza

    steps:
      - name: Configure timezone without questions
        run: |
          ln -snf /usr/share/zoneinfo/America/Fortaleza /etc/localtime
          echo "America/Fortaleza" > /etc/timezone
          dpkg-reconfigure -f noninteractive tzdata || true

      - name: Install build tools without interactive prompts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" git cmake make pkg-config

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout including gsKit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check PS2SDK toolchain
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          command -v mips64r5900el-ps2-elf-gcc
          command -v mips64r5900el-ps2-elf-g++
          test -d "$PS2DEV"
          test -d "$PS2SDK"

      - name: Configure and compile Backrooms maze
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
          cmake -S tyrarooms -B tyrarooms/build \
            -DCMAKE_C_COMPILER=mips64r5900el-ps2-elf-gcc \
            -DCMAKE_CXX_COMPILER=mips64r5900el-ps2-elf-g++ \
            -DCMAKE_ASM_COMPILER=mips64r5900el-ps2-elf-gcc
          cmake --build tyrarooms/build --parallel 2
          test -s tyrarooms/build/backrooms.elf
          ls -lh tyrarooms/build/backrooms.elf

      - name: Upload maze ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-ps2-maze
          path: tyrarooms/build/backrooms.elf
          if-no-files-found: error
