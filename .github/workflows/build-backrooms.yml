name: Build Backrooms PS2

on:
  workflow_dispatch:
  push:
    paths:
      - "tyrarooms/**"
      - ".github/workflows/build-backrooms.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: America/Fortaleza

    steps:
      - name: Configure timezone without questions
        run: |
          ln -snf /usr/share/zoneinfo/America/Fortaleza /etc/localtime
          echo "America/Fortaleza" > /etc/timezone
          dpkg-reconfigure -f noninteractive tzdata || true

      - name: Install build tools without interactive prompts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" git cmake make

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout including gsKit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check PS2SDK toolchain
        run: |
          echo "PS2DEV=$PS2DEV"
          command -v ee-gcc
          command -v ee-g++
          test -d "$PS2DEV"

      - name: Configure and compile Backrooms
        run: |
          cmake -S tyrarooms -B tyrarooms/build \
            -DCMAKE_C_COMPILER=ee-gcc \
            -DCMAKE_CXX_COMPILER=ee-g++ \
            -DCMAKE_ASM_COMPILER=ee-gcc
          cmake --build tyrarooms/build --parallel 2
          test -s tyrarooms/build/backrooms.elf
          ls -lh tyrarooms/build/backrooms.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-ps2-first-room
          path: tyrarooms/build/backrooms.elf
          if-no-files-found: error
