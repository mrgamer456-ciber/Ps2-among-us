name: Build Backrooms Clean Menu

on:
  push:
    paths:
      - "backrooms-menu-clean/**"
      - ".github/workflows/build-backrooms-menu-clean.yml"
  workflow_dispatch:

jobs:
  build-menu:
    runs-on: ubuntu-latest
    steps:
      # Checkout runs on the host runner, where Git is available.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile inside the PS2SDK image
        shell: bash
        run: |
          set -e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            h4570/tyra \
            bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              export TZ=America/Fortaleza
              apt-get update
              apt-get install -y tzdata cmake make python3-pil pkg-config git
              ln -snf /usr/share/zoneinfo/$TZ /etc/localtime
              echo "$TZ" > /etc/timezone
              dpkg-reconfigure -f noninteractive tzdata
              export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
              TAMTYPES="$(find "$PS2DEV" -path '*/common/include/tamtypes.h' -print -quit)"
              if [ -z "$TAMTYPES" ]; then
                echo "ERRO: tamtypes.h nao encontrado dentro de $PS2DEV"
                find "$PS2DEV" -maxdepth 4 -type d | head -80
                exit 1
              fi
              export PS2SDK="${TAMTYPES%/common/include/tamtypes.h}"
              echo "PS2DEV=$PS2DEV"
              echo "PS2SDK=$PS2SDK"
              git config --global --add safe.directory /work
              export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
              mkdir -p backrooms-menu-clean/assets
              cp tyrarooms/assets/menu/main.tga backrooms-menu-clean/assets/main.tga
              python3 backrooms-menu-clean/tools/make_background.py
              cmake -S backrooms-menu-clean -B backrooms-menu-clean/build \
                -DCMAKE_C_COMPILER=mips64r5900el-ps2-elf-gcc \
                -DCMAKE_CXX_COMPILER=mips64r5900el-ps2-elf-g++ \
                -DCMAKE_ASM_COMPILER=mips64r5900el-ps2-elf-gcc
              cmake --build backrooms-menu-clean/build --parallel 2
              test -s backrooms-menu-clean/build/backrooms-menu-clean-v2.elf
              test -s backrooms-menu-clean/build/backrooms-background-test-v3.elf
              test -s backrooms-menu-clean/build/backrooms-menu-atlas-v4.elf
            '
      - uses: actions/upload-artifact@v4
        with:
          name: Backrooms-PS2-Diagnostic-v3
          path: |
            backrooms-menu-clean/build/backrooms-menu-clean-v2.elf
            backrooms-menu-clean/build/backrooms-background-test-v3.elf
            backrooms-menu-clean/build/backrooms-menu-atlas-v4.elf
          if-no-files-found: error
